<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* Dark theme (default + prefers-color-scheme: dark) — matches the
       dashboard's cyberpunk palette: deep navy bg, neon green pulse, cyan dot */
    .bg     { fill: #050B14; }
    .border { stroke: #00E5FF; stroke-opacity: 0.35; }
    .pulse  { stroke: #00FF66; }
    .dot    { fill: #00FFFF; }
    .glow   { stop-color: #00FF66; }

    @media (prefers-color-scheme: light) {
      .bg     { fill: #E5EEF8; }
      .border { stroke: #0066CC; stroke-opacity: 0.5; }
      .pulse  { stroke: #00994C; }
      .dot    { fill: #0066CC; }
      .glow   { stop-color: #00994C; }
    }
  </style>

  <defs>
    <!-- Soft glow halo around the pulse line + dot -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" class="glow" stop-opacity="0.55"/>
      <stop offset="100%" class="glow" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background tile -->
  <rect class="bg" x="0" y="0" width="32" height="32" rx="7" ry="7"/>
  <rect class="border" x="0.5" y="0.5" width="31" height="31" rx="6.5" ry="6.5"
        fill="none" stroke-width="1"/>

  <!-- Soft inner glow behind the pulse so the icon reads at 16x16 -->
  <circle cx="16" cy="16" r="11" fill="url(#centerGlow)"/>

  <!-- Activity-style pulse line (heart-monitor zigzag), mirrors the lucide
       Activity icon used in AppToolbar — established system motif -->
  <polyline
    points="5,16 10,16 12.5,11 16,21 19.5,13 22,16 27,16"
    fill="none"
    class="pulse"
    stroke-width="2.4"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Live-data dot at the apex of the pulse — the "we're receiving signals" cue -->
  <circle class="dot" cx="16" cy="21" r="1.7" filter="url(#glow)"/>
</svg>
